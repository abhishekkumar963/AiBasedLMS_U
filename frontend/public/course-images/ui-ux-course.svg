<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D97706;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B45309;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="canvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FEF3C7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FDE68A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- Design canvas/board -->
  <rect x="100" y="80" width="250" height="300" fill="url(#canvas)" rx="8" opacity="0.9"/>
  
  <!-- Wireframe sketch -->
  <g transform="translate(120, 100)">
    <!-- Header -->
    <rect x="0" y="0" width="210" height="40" fill="#F97316" rx="4"/>
    <rect x="10" y="10" width="60" height="20" fill="#FFFFFF" rx="2"/>
    
    <!-- Navigation -->
    <rect x="80" y="10" width="30" height="20" fill="#FED7AA" rx="2"/>
    <rect x="120" y="10" width="30" height="20" fill="#FED7AA" rx="2"/>
    <rect x="160" y="10" width="40" height="20" fill="#FED7AA" rx="2"/>
    
    <!-- Content sections -->
    <rect x="0" y="50" width="100" height="80" fill="#FB923C" rx="4"/>
    <rect x="110" y="50" width="100" height="80" fill="#FB923C" rx="4"/>
    
    <rect x="0" y="140" width="210" height="40" fill="#F97316" rx="4"/>
    
    <rect x="0" y="190" width="65" height="60" fill="#FB923C" rx="4"/>
    <rect x="75" y="190" width="65" height="60" fill="#FB923C" rx="4"/>
    <rect x="145" y="190" width="65" height="60" fill="#FB923C" rx="4"/>
  </g>
  
  <!-- Design tools -->
  <g transform="translate(450, 120)">
    <!-- Pen tool -->
    <rect x="0" y="0" width="8" height="60" fill="#1F2937" rx="2" transform="rotate(45 4 30)"/>
    <polygon points="2,60 6,60 4,68" fill="#1F2937"/>
    
    <!-- Color palette -->
    <circle cx="40" cy="20" r="8" fill="#EF4444"/>
    <circle cx="60" cy="20" r="8" fill="#3B82F6"/>
    <circle cx="80" cy="20" r="8" fill="#10B981"/>
    <circle cx="100" cy="20" r="8" fill="#F59E0B"/>
    <circle cx="120" cy="20" r="8" fill="#8B5CF6"/>
    
    <!-- Ruler -->
    <rect x="30" y="40" width="100" height="12" fill="#D1D5DB" rx="2"/>
    <line x1="40" y1="40" x2="40" y2="52" stroke="#6B7280" stroke-width="1"/>
    <line x1="50" y1="40" x2="50" y2="52" stroke="#6B7280" stroke-width="1"/>
    <line x1="60" y1="40" x2="60" y2="52" stroke="#6B7280" stroke-width="1"/>
    <line x1="70" y1="40" x2="70" y2="52" stroke="#6B7280" stroke-width="1"/>
    <line x1="80" y1="40" x2="80" y2="52" stroke="#6B7280" stroke-width="1"/>
    <line x1="90" y1="40" x2="90" y2="52" stroke="#6B7280" stroke-width="1"/>
    <line x1="100" y1="40" x2="100" y2="52" stroke="#6B7280" stroke-width="1"/>
    <line x1="110" y1="40" x2="110" y2="52" stroke="#6B7280" stroke-width="1"/>
    <line x1="120" y1="40" x2="120" y2="52" stroke="#6B7280" stroke-width="1"/>
  </g>
  
  <!-- Figma logo representation -->
  <g transform="translate(600, 200)">
    <text x="0" y="0" text-anchor="middle" fill="#0ACF83" font-family="Arial, sans-serif" font-size="32" font-weight="bold">Figma</text>
  </g>
  
  <!-- User persona card -->
  <g transform="translate(420, 280)">
    <rect x="0" y="0" width="120" height="80" fill="#FFFFFF" rx="6" opacity="0.9"/>
    <circle cx="60" cy="25" r="12" fill="#F59E0B"/>
    <rect x="30" y="45" width="60" height="8" fill="#D1D5DB" rx="2"/>
    <rect x="20" y="58" width="80" height="6" fill="#E5E7EB" rx="2"/>
    <rect x="25" y="68" width="70" height="6" fill="#E5E7EB" rx="2"/>
  </g>
  
  <!-- Design elements floating -->
  <circle cx="150" cy="50" r="4" fill="#EF4444" opacity="0.7"/>
  <circle cx="170" cy="45" r="3" fill="#3B82F6" opacity="0.7"/>
  <circle cx="190" cy="52" r="5" fill="#10B981" opacity="0.7"/>
  
  <!-- Typography samples -->
  <text x="500" y="80" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="24" font-weight="bold">Aa</text>
  <text x="540" y="80" fill="#FFFFFF" font-family="serif" font-size="20">Aa</text>
  <text x="570" y="80" fill="#FFFFFF" font-family="monospace" font-size="18">Aa</text>
  
  <!-- UI components -->
  <rect x="50" y="400" width="40" height="20" fill="#3B82F6" rx="4"/>
  <rect x="100" y="400" width="40" height="20" fill="#10B981" rx="4"/>
  <rect x="150" y="400" width="40" height="20" fill="#F59E0B" rx="4"/>
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="36" font-weight="bold">UI/UX Design</text>
  
  <!-- Subtitle -->
  <text x="400" y="410" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" opacity="0.9">Design Beautiful User Experiences</text>
</svg>
