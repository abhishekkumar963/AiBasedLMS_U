<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFE66D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="flag" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#AA151B;stop-opacity:1" />
      <stop offset="33%" style="stop-color:#AA151B;stop-opacity:1" />
      <stop offset="33%" style="stop-color:#F1BF00;stop-opacity:1" />
      <stop offset="66%" style="stop-color:#F1BF00;stop-opacity:1" />
      <stop offset="66%" style="stop-color:#AA151B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#AA151B;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- Spanish flag inspired elements -->
  <rect x="50" y="100" width="200" height="120" fill="url(#flag)" rx="10" opacity="0.9"/>
  
  <!-- Book/Learning elements -->
  <rect x="300" y="150" width="180" height="220" fill="#FFFFFF" rx="8" transform="rotate(-5 390 260)"/>
  <rect x="320" y="160" width="140" height="200" fill="#F8F9FA" rx="4"/>
  
  <!-- Language bubbles -->
  <circle cx="550" cy="150" r="40" fill="#FFFFFF" opacity="0.9"/>
  <text x="550" y="160" text-anchor="middle" fill="#AA151B" font-family="Arial, sans-serif" font-size="28" font-weight="bold">¡Hola!</text>
  
  <circle cx="650" cy="220" r="35" fill="#FFFFFF" opacity="0.8"/>
  <text x="650" y="230" text-anchor="middle" fill="#AA151B" font-family="Arial, sans-serif" font-size="24" font-weight="bold">¿Qué?</text>
  
  <circle cx="580" cy="300" r="38" fill="#FFFFFF" opacity="0.85"/>
  <text x="580" y="310" text-anchor="middle" fill="#AA151B" font-family="Arial, sans-serif" font-size="26" font-weight="bold">Gracias</text>
  
  <!-- Decorative elements -->
  <path d="M 100 350 Q 200 320 300 350" stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M 450 380 Q 550 360 650 380" stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.6"/>
  
  <!-- Title -->
  <text x="400" y="80" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="36" font-weight="bold">Spanish for Beginners</text>
  
  <!-- Subtitle -->
  <text x="400" y="420" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" opacity="0.9">Learn Spanish with Interactive Lessons</text>
</svg>
