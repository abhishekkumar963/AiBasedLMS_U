<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ECC71;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#27AE60;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16A085;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="cell" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#E8F5E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C8E6C9;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- DNA Helix -->
  <g transform="translate(100, 150)">
    <path d="M 0 0 Q 50 -30 100 0 T 200 0 T 300 0" stroke="#FFFFFF" stroke-width="4" fill="none" opacity="0.8"/>
    <path d="M 0 20 Q 50 50 100 20 T 200 20 T 300 20" stroke="#FFFFFF" stroke-width="4" fill="none" opacity="0.8"/>
    
    <!-- DNA connections -->
    <line x1="0" y1="0" x2="0" y2="20" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
    <line x1="50" y1="-30" x2="50" y2="50" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
    <line x1="100" y1="0" x2="100" y2="20" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
    <line x1="150" y1="-30" x2="150" y2="50" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
    <line x1="200" y1="0" x2="200" y2="20" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
    <line x1="250" y1="-30" x2="250" y2="50" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
    <line x1="300" y1="0" x2="300" y2="20" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
  </g>
  
  <!-- Cell representation -->
  <circle cx="550" cy="200" r="80" fill="url(#cell)" opacity="0.9"/>
  <circle cx="550" cy="200" r="60" fill="none" stroke="#4CAF50" stroke-width="2" opacity="0.7"/>
  <circle cx="550" cy="200" r="40" fill="none" stroke="#4CAF50" stroke-width="2" opacity="0.7"/>
  
  <!-- Nucleus -->
  <circle cx="550" cy="200" r="25" fill="#2E7D32" opacity="0.8"/>
  
  <!-- Mitochondria -->
  <ellipse cx="480" cy="180" rx="15" ry="8" fill="#FF6B35" opacity="0.8" transform="rotate(30 480 180)"/>
  <ellipse cx="620" cy="220" rx="15" ry="8" fill="#FF6B35" opacity="0.8" transform="rotate(-30 620 220)"/>
  
  <!-- Microscope -->
  <g transform="translate(320, 280)">
    <!-- Base -->
    <rect x="0" y="80" width="80" height="10" fill="#34495E" rx="2"/>
    <!-- Arm -->
    <rect x="35" y="20" width="10" height="60" fill="#34495E"/>
    <!-- Lens holder -->
    <rect x="20" y="10" width="40" height="15" fill="#34495E" rx="3"/>
    <!-- Eyepiece -->
    <rect x="35" y="0" width="10" height="15" fill="#34495E"/>
    <!-- Objective lenses -->
    <circle cx="25" cy="25" r="3" fill="#3498DB"/>
    <circle cx="40" cy="25" r="3" fill="#3498DB"/>
    <circle cx="55" cy="25" r="3" fill="#3498DB"/>
    <!-- Stage -->
    <rect x="10" y="65" width="60" height="3" fill="#7F8C8D"/>
  </g>
  
  <!-- Molecules floating around -->
  <circle cx="150" cy="100" r="8" fill="#E74C3C" opacity="0.7"/>
  <circle cx="170" cy="110" r="6" fill="#3498DB" opacity="0.7"/>
  <circle cx="160" cy="125" r="7" fill="#F39C12" opacity="0.7"/>
  
  <circle cx="650" cy="120" r="8" fill="#E74C3C" opacity="0.7"/>
  <circle cx="670" cy="130" r="6" fill="#3498DB" opacity="0.7"/>
  <circle cx="660" cy="145" r="7" fill="#F39C12" opacity="0.7"/>
  
  <!-- Title -->
  <text x="400" y="80" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="36" font-weight="bold">Introduction to Biology</text>
  
  <!-- Subtitle -->
  <text x="400" y="420" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" opacity="0.9">Explore the Science of Life</text>
</svg>
