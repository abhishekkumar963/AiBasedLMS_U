<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#61DAFB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#21232A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="component" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#282C34;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#21232A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- React Logo -->
  <g transform="translate(350, 120)">
    <ellipse cx="50" cy="50" rx="60" ry="20" fill="none" stroke="#61DAFB" stroke-width="4" opacity="0.9"/>
    <ellipse cx="50" cy="50" rx="60" ry="20" fill="none" stroke="#61DAFB" stroke-width="4" opacity="0.9" transform="rotate(60 50 50)"/>
    <ellipse cx="50" cy="50" rx="60" ry="20" fill="none" stroke="#61DAFB" stroke-width="4" opacity="0.9" transform="rotate(120 50 50)"/>
    <circle cx="50" cy="50" r="8" fill="#61DAFB"/>
  </g>
  
  <!-- Component structure -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="180" height="120" fill="url(#component)" rx="6"/>
    <text x="90" y="20" text-anchor="middle" fill="#61DAFB" font-family="monospace" font-size="12" font-weight="bold">App.jsx</text>
    
    <!-- Component code -->
    <text x="10" y="40" fill="#C678DD" font-family="monospace" font-size="10">import</text>
    <text x="45" y="40" fill="#E06C75" font-family="monospace" font-size="10">React</text>
    <text x="80" y="40" fill="#C678DD" font-family="monospace" font-size="10">from</text>
    <text x="110" y="40" fill="#98C379" font-family="monospace" font-size="10">'react';</text>
    
    <text x="10" y="55" fill="#C678DD" font-family="monospace" font-size="10">const</text>
    <text x="40" y="55" fill="#61DAFB" font-family="monospace" font-size="10">App</text>
    <text x="60" y="55" fill="#D19A66" font-family="monospace" font-size="10">=</text>
    <text x="70" y="55" fill="#C678DD" font-family="monospace" font-size="10">()</text>
    <text x="85" y="55" fill="#D19A66" font-family="monospace" font-size="10">=&gt;</text>
    
    <text x="10" y="70" fill="#56B6C2" font-family="monospace" font-size="10">return</text>
    <text x="50" y="70" fill="#D19A66" font-family="monospace" font-size="10">(</text>
    
    <text x="20" y="85" fill="#E06C75" font-family="monospace" font-size="10">&lt;div&gt;</text>
    <text x="20" y="100" fill="#E06C75" font-family="monospace" font-size="10">&lt;h1&gt;</text>
    <text x="50" y="100" fill="#98C379" font-family="monospace" font-size="10">Hello React</text>
    <text x="120" y="100" fill="#E06C75" font-family="monospace" font-size="10">&lt;/h1&gt;</text>
    <text x="20" y="115" fill="#E06C75" font-family="monospace" font-size="10">&lt;/div&gt;</text>
    
    <text x="50" y="115" fill="#D19A66" font-family="monospace" font-size="10">)</text>
    
    <text x="10" y="115" fill="#C678DD" font-family="monospace" font-size="10">;</text>
    <text x="10" y="115" fill="#C678DD" font-family="monospace" font-size="10">export</text>
    <text x="50" y="115" fill="#C678DD" font-family="monospace" font-size="10">default</text>
    <text x="90" y="115" fill="#61DAFB" font-family="monospace" font-size="10">App;</text>
  </g>
  
  <!-- Props demonstration -->
  <g transform="translate(320, 250)">
    <rect x="0" y="0" width="160" height="80" fill="#FFFFFF" opacity="0.9" rx="4"/>
    <text x="80" y="20" text-anchor="middle" fill="#61DAFB" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Props Flow</text>
    
    <text x="10" y="40" fill="#C678DD" font-family="monospace" font-size="10">Parent Component</text>
    <text x="10" y="55" fill="#D19A66" font-family="monospace" font-size="10">↓</text>
    <text x="10" y="70" fill="#E06C75" font-family="monospace" font-size="10">&lt;Child</text>
    <text x="55" y="70" fill="#98C379" font-family="monospace" font-size="10">name="John"</text>
    <text x="110" y="70" fill="#E06C75" font-family="monospace" font-size="10">/&gt;</text>
  </g>
  
  <!-- State management -->
  <g transform="translate(520, 250)">
    <rect x="0" y="0" width="160" height="80" fill="#FFFFFF" opacity="0.9" rx="4"/>
    <text x="80" y="20" text-anchor="middle" fill="#61DAFB" font-family="Arial, sans-serif" font-size="12" font-weight="bold">useState Hook</text>
    
    <text x="10" y="40" fill="#C678DD" font-family="monospace" font-size="10">const [count,</text>
    <text x="10" y="55" fill="#61DAFB" font-family="monospace" font-size="10">setCount]</text>
    <text x="10" y="70" fill="#D19A66" font-family="monospace" font-size="10">= useState(0);</text>
  </g>
  
  <!-- Component tree -->
  <g transform="translate(150, 340)">
    <circle cx="50" cy="20" r="15" fill="#61DAFB" opacity="0.8"/>
    <text x="50" y="25" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">App</text>
    
    <line x1="65" y1="20" x2="100" y2="20" stroke="#61DAFB" stroke-width="2" opacity="0.6"/>
    <circle cx="120" cy="20" r="12" fill="#61DAFB" opacity="0.8"/>
    <text x="120" y="24" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="8">Header</text>
    
    <line x1="65" y1="20" x2="100" y2="40" stroke="#61DAFB" stroke-width="2" opacity="0.6"/>
    <circle cx="120" cy="40" r="12" fill="#61DAFB" opacity="0.8"/>
    <text x="120" y="44" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="8">Main</text>
    
    <line x1="65" y1="20" x2="100" y2="60" stroke="#61DAFB" stroke-width="2" opacity="0.6"/>
    <circle cx="120" cy="60" r="12" fill="#61DAFB" opacity="0.8"/>
    <text x="120" y="64" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="8">Footer</text>
  </g>
  
  <!-- Floating React symbols -->
  <text x="50" y="80" fill="#FFFFFF" font-family="monospace" font-size="14" opacity="0.6">useState</text>
  <text x="700" y="90" fill="#FFFFFF" font-family="monospace" font-size="14" opacity="0.6">useEffect</text>
  <text x="80" y="400" fill="#FFFFFF" font-family="monospace" font-size="14" opacity="0.6">props</text>
  <text x="680" y="380" fill="#FFFFFF" font-family="monospace" font-size="14" opacity="0.6">state</text>
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="36" font-weight="bold">React Development Bootcamp</text>
  
  <!-- Subtitle -->
  <text x="400" y="420" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" opacity="0.9">Build Modern Web Applications</text>
</svg>
