<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667EEA;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764BA2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F093FB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="code" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#312E81;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- Browser window -->
  <rect x="50" y="100" width="300" height="200" fill="#FFFFFF" rx="8" opacity="0.95"/>
  <rect x="50" y="100" width="300" height="30" fill="#E5E7EB" rx="8"/>
  <rect x="50" y="125" width="300" height="175" fill="url(#code)"/>
  
  <!-- Browser controls -->
  <circle cx="70" cy="115" r="5" fill="#EF4444"/>
  <circle cx="85" cy="115" r="5" fill="#F59E0B"/>
  <circle cx="100" cy="115" r="5" fill="#10B981"/>
  
  <!-- Code lines -->
  <text x="65" y="150" fill="#10B981" font-family="monospace" font-size="12">&lt;div className="container"&gt;</text>
  <text x="75" y="170" fill="#60A5FA" font-family="monospace" font-size="12">&lt;h1&gt;Hello World&lt;/h1&gt;</text>
  <text x="75" y="190" fill="#60A5FA" font-family="monospace" font-size="12">&lt;p&gt;Welcome to Web Dev&lt;/p&gt;</text>
  <text x="65" y="210" fill="#10B981" font-family="monospace" font-size="12">&lt;/div&gt;</text>
  
  <!-- React logo -->
  <g transform="translate(450, 180)">
    <ellipse cx="0" cy="0" rx="60" ry="20" fill="none" stroke="#61DAFB" stroke-width="3" opacity="0.8"/>
    <ellipse cx="0" cy="0" rx="60" ry="20" fill="none" stroke="#61DAFB" stroke-width="3" opacity="0.8" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="60" ry="20" fill="none" stroke="#61DAFB" stroke-width="3" opacity="0.8" transform="rotate(120)"/>
    <circle cx="0" cy="0" r="8" fill="#61DAFB"/>
  </g>
  
  <!-- JavaScript/Node logo -->
  <g transform="translate(600, 200)">
    <text x="0" y="0" text-anchor="middle" fill="#F7DF1E" font-family="Arial, sans-serif" font-size="48" font-weight="bold">JS</text>
    <text x="0" y="20" text-anchor="middle" fill="#F7DF1E" font-family="Arial, sans-serif" font-size="24">Node.js</text>
  </g>
  
  <!-- Floating code symbols -->
  <text x="150" y="80" fill="#FFFFFF" font-family="monospace" font-size="20" opacity="0.6">{...}</text>
  <text x="650" y="100" fill="#FFFFFF" font-family="monospace" font-size="18" opacity="0.6">&lt;/&gt;</text>
  <text x="200" y="350" fill="#FFFFFF" font-family="monospace" font-size="16" opacity="0.6">function()</text>
  <text x="550" y="340" fill="#FFFFFF" font-family="monospace" font-size="18" opacity="0.6">const</text>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="350" r="4" fill="#FBBF24" opacity="0.8"/>
  <circle cx="120" cy="360" r="3" fill="#34D399" opacity="0.8"/>
  <circle cx="140" cy="355" r="5" fill="#F87171" opacity="0.8"/>
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="36" font-weight="bold">Web Development</text>
  
  <!-- Subtitle -->
  <text x="400" y="410" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" opacity="0.9">Build Modern Web Applications</text>
</svg>
