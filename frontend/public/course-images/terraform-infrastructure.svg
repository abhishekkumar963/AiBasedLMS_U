<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#623CE4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7B42F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#623CE4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- Terraform Logo -->
  <g transform="translate(350, 120)">
    <!-- Terraform T shape -->
    <rect x="40" y="20" width="20" height="50" fill="#623CE4" opacity="0.9"/>
    <rect x="25" y="35" width="50" height="15" fill="#7B42F6" opacity="0.9"/>
    <text x="50" y="85" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Terraform</text>
    <text x="50" y="105" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="12">Infrastructure as Code</text>
  </g>
  
  <!-- IaC Workflow -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="200" height="120" fill="#FFFFFF" opacity="0.9" rx="6"/>
    <text x="100" y="20" text-anchor="middle" fill="#623CE4" font-family="Arial, sans-serif" font-size="14" font-weight="bold">IaC Workflow</text>
    
    <!-- Workflow stages -->
    <rect x="10" y="35" width="35" height="25" fill="#623CE4" rx="3"/>
    <text x="27" y="45" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="8">Write</text>
    <text x="27" y="56" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="6">Code</text>
    
    <path d="M 45 47 L 65 47" stroke="#623CE4" stroke-width="2" marker-end="url(#arrow-purple)"/>
    
    <rect x="65" y="35" width="35" height="25" fill="#7B42F6" rx="3"/>
    <text x="82" y="45" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="8">Plan</text>
    <text x="82" y="56" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="6">Review</text>
    
    <path d="M 100 47 L 120 47" stroke="#623CE4" stroke-width="2" marker-end="url(#arrow-purple)"/>
    
    <rect x="120" y="35" width="35" height="25" fill="#623CE4" rx="3"/>
    <text x="137" y="45" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="8">Apply</text>
    <text x="137" y="56" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="6">Deploy</text>
    
    <!-- Status -->
    <circle cx="27" cy="75" r="5" fill="#00C851"/>
    <text x="27" y="90" text-anchor="middle" fill="#666666" font-family="Arial, sans-serif" font-size="8">Done</text>
    
    <circle cx="82" cy="75" r="5" fill="#FFB300"/>
    <text x="82" y="90" text-anchor="middle" fill="#666666" font-family="Arial, sans-serif" font-size="8">Plan</text>
    
    <circle cx="137" cy="75" r="5" fill="#00C851"/>
    <text x="137" y="90" text-anchor="middle" fill="#666666" font-family="Arial, sans-serif" font-size="8">Ready</text>
  </g>
  
  <!-- Terraform Configuration -->
  <g transform="translate(320, 100)">
    <rect x="0" y="0" width="200" height="120" fill="#FFFFFF" opacity="0.9" rx="6"/>
    <text x="100" y="20" text-anchor="middle" fill="#623CE4" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Terraform Config</text>
    
    <!-- HCL content -->
    <text x="10" y="40" fill="#E06C75" font-family="monospace" font-size="10">provider</text>
    <text x="45" y="40" fill="#E06C75" font-family="monospace" font-size="10">"aws"</text>
    <text x="65" y="40" fill="#E06C75" font-family="monospace" font-size="10">{</text>
    
    <text x="20" y="52" fill="#61DAFB" font-family="monospace" font-size="10">region</text>
    <text x="50" y="52" fill="#D19A66" font-family="monospace" font-size="10">=</text>
    <text x="55" y="52" fill="#98C379" font-family="monospace" font-size="10">"us-east-1"</text>
    
    <text x="10" y="64" fill="#E06C75" font-family="monospace" font-size="10">}</text>
    
    <text x="10" y="76" fill="#C678DD" font-family="monospace" font-size="10">resource</text>
    <text x="50" y="76" fill="#E06C75" font-family="monospace" font-size="10">"aws_instance"</text>
    <text x="110" y="76" fill="#98C379" font-family="monospace" font-size="10">"web"</text>
    <text x="125" y="76" fill="#E06C75" font-family="monospace" font-size="10">{</text>
    
    <text x="20" y="88" fill="#61DAFB" font-family="monospace" font-size="10">ami</text>
    <text x="35" y="88" fill="#D19A66" font-family="monospace" font-size="10">=</text>
    <text x="40" y="88" fill="#98C379" font-family="monospace" font-size="10">"ami-123456"</text>
    
    <text x="20" y="100" fill="#61DAFB" font-family="monospace" font-size="10">instance_type</text>
    <text x="85" y="100" fill="#D19A66" font-family="monospace" font-size="10">=</text>
    <text x="90" y="100" fill="#98C379" font-family="monospace" font-size="10">"t3.micro"</text>
    
    <text x="10" y="112" fill="#E06C75" font-family="monospace" font-size="10">}</text>
  </g>
  
  <!-- Terraform Commands -->
  <g transform="translate(540, 100)">
    <rect x="0" y="0" width="200" height="120" fill="#FFFFFF" opacity="0.9" rx="6"/>
    <text x="100" y="20" text-anchor="middle" fill="#623CE4" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Terraform CLI</text>
    
    <!-- Command examples -->
    <text x="10" y="40" fill="#666666" font-family="monospace" font-size="9">terraform init</text>
    <text x="10" y="52" fill="#666666" font-family="monospace" font-size="9">terraform fmt</text>
    <text x="10" y="64" fill="#666666" font-family="monospace" font-size="9">terraform validate</text>
    <text x="10" y="76" fill="#666666" font-family="monospace" font-size="9">terraform plan</text>
    <text x="10" y="88" fill="#666666" font-family="monospace" font-size="9">terraform apply</text>
    <text x="10" y="100" fill="#666666" font-family="monospace" font-size="9">terraform destroy</text>
    <text x="10" y="112" fill="#666666" font-family="monospace" font-size="9">terraform state list</text>
  </g>
  
  <!-- Modules -->
  <g transform="translate(100, 280)">
    <rect x="0" y="0" width="200" height="120" fill="#FFFFFF" opacity="0.9" rx="6"/>
    <text x="100" y="20" text-anchor="middle" fill="#623CE4" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Modules</text>
    
    <!-- Module structure -->
    <rect x="10" y="35" width="180" height="70" fill="#F5F5F5" rx="4"/>
    
    <!-- Root module -->
    <rect x="15" y="40" width="170" height="8" fill="#623CE4" opacity="0.8"/>
    <text x="100" y="46" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="8">Root Module</text>
    
    <!-- Child modules -->
    <rect x="20" y="55" width="50" height="20" fill="#7B42F6" rx="2"/>
    <text x="45" y="65" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="7">VPC</text>
    
    <rect x="75" y="55" width="50" height="20" fill="#623CE4" rx="2"/>
    <text x="100" y="65" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="7">Security</text>
    
    <rect x="130" y="55" width="50" height="20" fill="#7B42F6" rx="2"/>
    <text x="155" y="65" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="7">Compute</text>
    
    <!-- Module files -->
    <rect x="20" y="80" width="35" height="20" fill="#623CE4" rx="2"/>
    <text x="37" y="90" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="6">main.tf</text>
    
    <rect x="60" y="80" width="35" height="20" fill="#7B42F6" rx="2"/>
    <text x="77" y="90" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="6">vars.tf</text>
    
    <rect x="100" y="80" width="35" height="20" fill="#623CE4" rx="2"/>
    <text x="117" y="90" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="6">outputs.tf</text>
    
    <rect x="140" y="80" width="35" height="20" fill="#7B42F6" rx="2"/>
    <text x="157" y="90" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="6">README.md</text>
  </g>
  
  <!-- State Management -->
  <g transform="translate(320, 280)">
    <rect x="0" y="0" width="200" height="120" fill="#FFFFFF" opacity="0.9" rx="6"/>
    <text x="100" y="20" text-anchor="middle" fill="#623CE4" font-family="Arial, sans-serif" font-size="14" font-weight="bold">State Management</text>
    
    <!-- State backends -->
    <rect x="10" y="35" width="85" height="25" fill="#623CE4" rx="3"/>
    <text x="52" y="52" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">Local</text>
    
    <rect x="105" y="35" width="85" height="25" fill="#7B42F6" rx="3"/>
    <text x="147" y="52" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">S3</text>
    
    <rect x="10" y="65" width="85" height="25" fill="#623CE4" rx="3"/>
    <text x="52" y="82" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">Terraform Cloud</text>
    
    <rect x="105" y="65" width="85" height="25" fill="#7B42F6" rx="3"/>
    <text x="147" y="82" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">Azure Blob</text>
    
    <text x="100" y="115" text-anchor="middle" fill="#666666" font-family="monospace" font-size="9">Remote State Locking</text>
  </g>
  
  <!-- Cloud Providers -->
  <g transform="translate(540, 280)">
    <rect x="0" y="0" width="200" height="120" fill="#FFFFFF" opacity="0.9" rx="6"/>
    <text x="100" y="20" text-anchor="middle" fill="#623CE4" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Providers</text>
    
    <!-- Provider boxes -->
    <rect x="10" y="35" width="85" height="25" fill="#623CE4" rx="3"/>
    <text x="52" y="52" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">AWS</text>
    
    <rect x="105" y="35" width="85" height="25" fill="#7B42F6" rx="3"/>
    <text x="147" y="52" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">Azure</text>
    
    <rect x="10" y="65" width="85" height="25" fill="#623CE4" rx="3"/>
    <text x="52" y="82" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">GCP</text>
    
    <rect x="105" y="65" width="85" height="25" fill="#7B42F6" rx="3"/>
    <text x="147" y="82" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">Kubernetes</text>
    
    <rect x="55" y="95" width="90" height="20" fill="#623CE4" rx="3"/>
    <text x="100" y="108" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">Multi-Cloud</text>
  </g>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#623CE4"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="36" font-weight="bold">Terraform Infrastructure</text>
  
  <!-- Subtitle -->
  <text x="400" y="420" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" opacity="0.9">Infrastructure as Code Automation</text>
</svg>
