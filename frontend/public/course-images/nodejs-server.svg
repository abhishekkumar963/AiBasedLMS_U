<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#339933;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8CC84B;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- Node.js Logo -->
  <g transform="translate(350, 130)">
    <!-- Node.js hexagon shape -->
    <polygon points="50,20 80,35 80,65 50,80 20,65 20,35" fill="#8CC84B" opacity="0.9"/>
    <text x="50" y="55" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Node.js</text>
  </g>
  
  <!-- Event Loop Visualization -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="200" height="150" fill="#FFFFFF" opacity="0.9" rx="6"/>
    <text x="100" y="20" text-anchor="middle" fill="#339933" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Event Loop</text>
    
    <!-- Call Stack -->
    <rect x="10" y="35" width="60" height="40" fill="#E8F5E8" rx="3"/>
    <text x="40" y="55" text-anchor="middle" fill="#339933" font-family="monospace" font-size="10">Call Stack</text>
    
    <!-- Event Queue -->
    <rect x="80" y="35" width="60" height="40" fill="#FFF3E0" rx="3"/>
    <text x="110" y="55" text-anchor="middle" fill="#339933" font-family="monospace" font-size="10">Event Queue</text>
    
    <!-- Heap -->
    <rect x="150" y="35" width="40" height="40" fill="#F0F8FF" rx="3"/>
    <text x="170" y="55" text-anchor="middle" fill="#339933" font-family="monospace" font-size="10">Heap</text>
    
    <!-- Arrows showing flow -->
    <path d="M 40 75 L 40 85 L 110 85 L 110 75" stroke="#339933" stroke-width="2" fill="none"/>
    <path d="M 110 75 L 110 85 L 170 85 L 170 75" stroke="#339933" stroke-width="2" fill="none"/>
    
    <!-- Async operations -->
    <text x="10" y="110" fill="#666666" font-family="monospace" font-size="9">setTimeout(() => {}, 1000);</text>
    <text x="10" y="125" fill="#666666" font-family="monospace" font-size="9">fs.readFile('file.txt', callback);</text>
    <text x="10" y="140" fill="#666666" font-family="monospace" font-size="9">http.get('/api', callback);</text>
  </g>
  
  <!-- NPM Packages -->
  <g transform="translate(350, 250)">
    <rect x="0" y="0" width="250" height="120" fill="#FFFFFF" opacity="0.9" rx="6"/>
    <text x="125" y="20" text-anchor="middle" fill="#339933" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Popular NPM Packages</text>
    
    <!-- Package boxes -->
    <rect x="10" y="35" width="70" height="25" fill="#CB3837" rx="3"/>
    <text x="45" y="52" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">express</text>
    
    <rect x="90" y="35" width="70" height="25" fill="#088A08" rx="3"/>
    <text x="125" y="52" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">lodash</text>
    
    <rect x="170" y="35" width="70" height="25" fill="#FF6B6B" rx="3"/>
    <text x="205" y="52" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">axios</text>
    
    <rect x="10" y="70" width="70" height="25" fill="#61DAFB" rx="3"/>
    <text x="45" y="87" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">react</text>
    
    <rect x="90" y="70" width="70" height="25" fill="#339933" rx="3"/>
    <text x="125" y="87" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">socket.io</text>
    
    <rect x="170" y="70" width="70" height="25" fill="#4DB5FF" rx="3"/>
    <text x="205" y="87" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">mongoose</text>
  </g>
  
  <!-- Server Architecture -->
  <g transform="translate(650, 250)">
    <rect x="0" y="0" width="120" height="120" fill="#FFFFFF" opacity="0.9" rx="6"/>
    <text x="60" y="20" text-anchor="middle" fill="#339933" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Server</text>
    
    <!-- Server components -->
    <circle cx="30" cy="50" r="8" fill="#339933"/>
    <text x="30" y="70" text-anchor="middle" fill="#666666" font-family="Arial, sans-serif" font-size="8">HTTP</text>
    
    <circle cx="60" cy="50" r="8" fill="#8CC84B"/>
    <text x="60" y="70" text-anchor="middle" fill="#666666" font-family="Arial, sans-serif" font-size="8">TCP</text>
    
    <circle cx="90" cy="50" r="8" fill="#339933"/>
    <text x="90" y="70" text-anchor="middle" fill="#666666" font-family="Arial, sans-serif" font-size="8">Socket</text>
    
    <!-- Connections -->
    <line x1="30" y1="42" x2="60" y2="42" stroke="#339933" stroke-width="2"/>
    <line x1="60" y1="42" x2="90" y2="42" stroke="#8CC84B" stroke-width="2"/>
  </g>
  
  <!-- Terminal/Console -->
  <g transform="translate(100, 320)">
    <rect x="0" y="0" width="200" height="60" fill="#000000" opacity="0.8" rx="4"/>
    <text x="5" y="15" fill="#00FF00" font-family="monospace" font-size="10">$ node server.js</text>
    <text x="5" y="30" fill="#00FF00" font-family="monospace" font-size="10">Server running on port 3000</text>
    <text x="5" y="45" fill="#00FF00" font-family="monospace" font-size="10">Connected clients: 5</text>
  </g>
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="36" font-weight="bold">Node.js Server Programming</text>
  
  <!-- Subtitle -->
  <text x="400" y="420" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" opacity="0.9">Event-Driven JavaScript Runtime</text>
</svg>
