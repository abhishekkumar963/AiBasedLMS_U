<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3DDC84;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3DDC84;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- Android Device -->
  <g transform="translate(350, 120)">
    <!-- Android phone frame -->
    <rect x="30" y="20" width="40" height="70" fill="#3DDC84" rx="8"/>
    <rect x="32" y="25" width="36" height="60" fill="#000000" rx="6"/>
    
    <!-- Android logo -->
    <text x="50" y="50" text-anchor="middle" fill="#3DDC84" font-family="Arial, sans-serif" font-size="10">🤖</text>
    
    <!-- Status bar -->
    <rect x="35" y="28" width="30" height="3" fill="#3DDC84" rx="1"/>
    
    <!-- Navigation buttons -->
    <circle cx="40" cy="82" r="2" fill="#666666"/>
    <rect x="47" y="80" width="6" height="4" fill="#666666" rx="1"/>
    <circle cx="60" cy="82" r="2" fill="#666666"/>
    
    <text x="50" y="105" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="14">Android Development</text>
    <text x="50" y="120" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">Kotlin & Jetpack</text>
  </g>
  
  <!-- Kotlin Code -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="200" height="120" fill="#FFFFFF" opacity="0.9" rx="6"/>
    <text x="100" y="20" text-anchor="middle" fill="#3DDC84" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Kotlin Code</text>
    
    <!-- Kotlin syntax -->
    <text x="10" y="40" fill="#C678DD" font-family="monospace" font-size="10">class</text>
    <text x="40" y="40" fill="#61DAFB" font-family="monospace" font-size="10">MainActivity</text>
    <text x="100" y="40" fill="#E06C75" font-family="monospace" font-size="10">:</text>
    <text x="105" y="40" fill="#61DAFB" font-family="monospace" font-size="10">AppCompatActivity</text>
    <text x="175" y="40" fill="#E06C75" font-family="monospace" font-size="10">()</text>
    <text x="185" y="40" fill="#E06C75" font-family="monospace" font-size="10">{</text>
    
    <text x="20" y="52" fill="#C678DD" font-family="monospace" font-size="10">override</text>
    <text x="65" y="52" fill="#C678DD" font-family="monospace" font-size="10">fun</text>
    <text x="80" y="52" fill="#61DAFB" font-family="monospace" font-size="10">onCreate</text>
    <text x="120" y="52" fill="#E06C75" font-family="monospace" font-size="10">(</text>
    <text x="125" y="52" fill="#61DAFB" font-family="monospace" font-size="10">savedInstanceState</text>
    <text x="185" y="52" fill="#E06C75" font-family="monospace" font-size="10">:</text>
    <text x="190" y="52" fill="#61DAFB" font-family="monospace" font-size="10">Bundle?</text>
    <text x="215" y="52" fill="#E06C75" font-family="monospace" font-size="10">)</text>
    <text x="225" y="52" fill="#E06C75" font-family="monospace" font-size="10">{</text>
    
    <text x="30" y="64" fill="#C678DD" font-family="monospace" font-size="10">super</text>
    <text x="55" y="64" fill="#E06C75" font-family="monospace" font-size="10">.</text>
    <text x="60" y="64" fill="#61DAFB" font-family="monospace" font-size="10">onCreate</text>
    <text x="100" y="64" fill="#E06C75" font-family="monospace" font-size="10">(savedInstanceState)</text>
    
    <text x="30" y="76" fill="#61DAFB" font-family="monospace" font-size="10">setContentView</text>
    <text x="105" y="76" fill="#E06C75" font-family="monospace" font-size="10">(R.layout.activity_main)</text>
    
    <text x="30" y="88" fill="#61DAFB" font-family="monospace" font-size="10">val</text>
    <text x="45" y="88" fill="#61DAFB" font-family="monospace" font-size="10">button</text>
    <text x="75" y="88" fill="#D19A66" font-family="monospace" font-size="10">=</text>
    <text x="85" y="88" fill="#61DAFB" font-family="monospace" font-size="10">findViewById</text>
    <text x="145" y="88" fill="#E06C75" font-family="monospace" font-size="10">(R.id.button)</text>
    
    <text x="10" y="100" fill="#E06C75" font-family="monospace" font-size="10">}</text>
    
    <text x="10" y="112" fill="#E06C75" font-family="monospace" font-size="10">}</text>
  </g>
  
  <!-- Android Components -->
  <g transform="translate(320, 100)">
    <rect x="0" y="0" width="200" height="120" fill="#FFFFFF" opacity="0.9" rx="6"/>
    <text x="100" y="20" text-anchor="middle" fill="#3DDC84" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Android Components</text>
    
    <!-- Component boxes -->
    <rect x="10" y="35" width="85" height="25" fill="#3DDC84" rx="3"/>
    <text x="52" y="52" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">Activities</text>
    
    <rect x="105" y="35" width="85" height="25" fill="#4CAF50" rx="3"/>
    <text x="147" y="52" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">Fragments</text>
    
    <rect x="10" y="65" width="85" height="25" fill="#3DDC84" rx="3"/>
    <text x="52" y="82" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">Services</text>
    
    <rect x="105" y="65" width="85" height="25" fill="#4CAF50" rx="3"/>
    <text x="147" y="82" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">Broadcast Receivers</text>
    
    <rect x="55" y="95" width="90" height="20" fill="#3DDC84" rx="3"/>
    <text x="100" y="108" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">Content Providers</text>
  </g>
  
  <!-- Jetpack Libraries -->
  <g transform="translate(540, 100)">
    <rect x="0" y="0" width="200" height="120" fill="#FFFFFF" opacity="0.9" rx="6"/>
    <text x="100" y="20" text-anchor="middle" fill="#3DDC84" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Jetpack Libraries</text>
    
    <!-- Library boxes -->
    <rect x="10" y="35" width="85" height="25" fill="#3DDC84" rx="3"/>
    <text x="52" y="52" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">ViewModel</text>
    
    <rect x="105" y="35" width="85" height="25" fill="#4CAF50" rx="3"/>
    <text x="147" y="52" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">LiveData</text>
    
    <rect x="10" y="65" width="85" height="25" fill="#3DDC84" rx="3"/>
    <text x="52" y="82" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">Room</text>
    
    <rect x="105" y="65" width="85" height="25" fill="#4CAF50" rx="3"/>
    <text x="147" y="82" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">Navigation</text>
    
    <rect x="55" y="95" width="90" height="20" fill="#3DDC84" rx="3"/>
    <text x="100" y="108" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">Compose</text>
  </g>
  
  <!-- Gradle Build -->
  <g transform="translate(100, 280)">
    <rect x="0" y="0" width="200" height="120" fill="#FFFFFF" opacity="0.9" rx="6"/>
    <text x="100" y="20" text-anchor="middle" fill="#3DDC84" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Gradle Build</text>
    
    <!-- Gradle content -->
    <text x="10" y="40" fill="#E06C75" font-family="monospace" font-size="10">plugins</text>
    <text x="45" y="40" fill="#E06C75" font-family="monospace" font-size="10">{</text>
    
    <text x="20" y="52" fill="#61DAFB" font-family="monospace" font-size="10">id</text>
    <text x="35" y="52" fill="#E06C75" font-family="monospace" font-size="10">(</text>
    <text x="40" y="52" fill="#98C379" font-family="monospace" font-size="10">'com.android.application'</text>
    <text x="145" y="52" fill="#E06C75" font-family="monospace" font-size="10">)</text>
    
    <text x="20" y="64" fill="#61DAFB" font-family="monospace" font-size="10">id</text>
    <text x="35" y="64" fill="#E06C75" font-family="monospace" font-size="10">(</text>
    <text x="40" y="64" fill="#98C379" font-family="monospace" font-size="10">'org.jetbrains.kotlin.android'</text>
    <text x="165" y="64" fill="#E06C75" font-family="monospace" font-size="10">)</text>
    
    <text x="10" y="76" fill="#E06C75" font-family="monospace" font-size="10">}</text>
    
    <text x="10" y="88" fill="#61DAFB" font-family="monospace" font-size="10">android</text>
    <text x="45" y="88" fill="#E06C75" font-family="monospace" font-size="10">{</text>
    
    <text x="20" y="100" fill="#61DAFB" font-family="monospace" font-size="10">compileSdk</text>
    <text x="70" y="100" fill="#D19A66" font-family="monospace" font-size="10">33</text>
    
    <text x="10" y="112" fill="#E06C75" font-family="monospace" font-size="10">}</text>
  </g>
  
  <!-- Google Play -->
  <g transform="translate(320, 280)">
    <rect x="0" y="0" width="200" height="120" fill="#FFFFFF" opacity="0.9" rx="6"/>
    <text x="100" y="20" text-anchor="middle" fill="#3DDC84" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Google Play</text>
    
    <!-- Play Store icon -->
    <rect x="75" y="35" width="50" height="50" fill="#3DDC84" rx="12"/>
    <text x="100" y="55" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="8">Play</text>
    <text x="100" y="65" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="8">Store</text>
    
    <!-- Features -->
    <text x="10" y="100" fill="#666666" font-family="Arial, sans-serif" font-size="9">✓ App Publishing</text>
    <text x="10" y="112" fill="#666666" font-family="Arial, sans-serif" font-size="9">✓ In-App Billing</text>
    
    <text x="110" y="100" fill="#666666" font-family="Arial, sans-serif" font-size="9">✓ App Review</text>
    <text x="110" y="112" fill="#666666" font-family="Arial, sans-serif" font-size="9">✓ Analytics</text>
  </g>
  
  <!-- Material Design -->
  <g transform="translate(540, 280)">
    <rect x="0" y="0" width="200" height="120" fill="#FFFFFF" opacity="0.9" rx="6"/>
    <text x="100" y="20" text-anchor="middle" fill="#3DDC84" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Material Design</text>
    
    <!-- Design components -->
    <rect x="10" y="35" width="85" height="25" fill="#3DDC84" rx="3"/>
    <text x="52" y="52" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">Material 3</text>
    
    <rect x="105" y="35" width="85" height="25" fill="#4CAF50" rx="3"/>
    <text x="147" y="52" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">Themes</text>
    
    <rect x="10" y="65" width="85" height="25" fill="#3DDC84" rx="3"/>
    <text x="52" y="82" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">Components</text>
    
    <rect x="105" y="65" width="85" height="25" fill="#4CAF50" rx="3"/>
    <text x="147" y="82" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">Motion</text>
    
    <text x="100" y="115" text-anchor="middle" fill="#666666" font-family="monospace" font-size="9">Modern UI/UX</text>
  </g>
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="36" font-weight="bold">Android Kotlin Development</text>
  
  <!-- Subtitle -->
  <text x="400" y="420" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" opacity="0.9">Native Android App Development</text>
</svg>
