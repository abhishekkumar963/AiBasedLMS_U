<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F7DF1E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0DB4F;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- JavaScript Logo -->
  <g transform="translate(350, 140)">
    <!-- JS letters -->
    <text x="50" y="40" text-anchor="middle" fill="#323330" font-family="Arial, sans-serif" font-size="48" font-weight="bold">JS</text>
  </g>
  
  <!-- Code editor window -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="250" height="180" fill="#1E1E1E" rx="6"/>
    <rect x="0" y="0" width="250" height="25" fill="#2D2D30" rx="6"/>
    
    <!-- Window controls -->
    <circle cx="15" cy="12" r="4" fill="#FF5F56"/>
    <circle cx="27" cy="12" r="4" fill="#FFBD2E"/>
    <circle cx="39" cy="12" r="4" fill="#27C93F"/>
    
    <!-- Code lines -->
    <text x="10" y="50" fill="#569CD6" font-family="monospace" font-size="12">const</text>
    <text x="50" y="50" fill="#9CDCFE" font-family="monospace" font-size="12">name</text>
    <text x="90" y="50" fill="#D4D4D4" font-family="monospace" font-size="12">=</text>
    <text x="100" y="50" fill="#CE9178" font-family="monospace" font-size="12">"JavaScript"</text>
    <text x="175" y="50" fill="#D4D4D4" font-family="monospace" font-size="12">;</text>
    
    <text x="10" y="70" fill="#569CD6" font-family="monospace" font-size="12">function</text>
    <text x="70" y="70" fill="#DCDCAA" font-family="monospace" font-size="12">greet</text>
    <text x="105" y="70" fill="#D4D4D4" font-family="monospace" font-size="12">(</text>
    <text x="110" y="70" fill="#9CDCFE" font-family="monospace" font-size="12">user</text>
    <text x="145" y="70" fill="#D4D4D4" font-family="monospace" font-size="12">) {</text>
    
    <text x="20" y="90" fill="#C586C0" font-family="monospace" font-size="12">return</text>
    <text x="60" y="90" fill="#CE9178" font-family="monospace" font-size="12">`Hello, </text>
    <text x="115" y="90" fill="#9CDCFE" font-family="monospace" font-size="12">${user}</text>
    <text x="145" y="90" fill="#CE9178" font-family="monospace" font-size="12">!`</text>
    <text x="175" y="90" fill="#D4D4D4" font-family="monospace" font-size="12">;</text>
    
    <text x="10" y="110" fill="#D4D4D4" font-family="monospace" font-size="12">}</text>
    
    <text x="10" y="130" fill="#569CD6" font-family="monospace" font-size="12">console.</text>
    <text x="65" y="130" fill="#DCDCAA" font-family="monospace" font-size="12">log</text>
    <text x="90" y="130" fill="#D4D4D4" font-family="monospace" font-size="12">(</text>
    <text x="95" y="130" fill="#DCDCAA" font-family="monospace" font-size="12">greet</text>
    <text x="125" y="130" fill="#D4D4D4" font-family="monospace" font-size="12">(</text>
    <text x="130" y="130" fill="#CE9178" font-family="monospace" font-size="12">"World"</text>
    <text x="175" y="130" fill="#D4D4D4" font-family="monospace" font-size="12">));</text>
    
    <text x="10" y="150" fill="#6A9955" font-family="monospace" font-size="12">// Modern ES6+ syntax</text>
  </g>
  
  <!-- JavaScript concepts floating -->
  <g transform="translate(450, 100)">
    <!-- Arrow function -->
    <rect x="0" y="0" width="200" height="40" fill="#FFFFFF" opacity="0.9" rx="4"/>
    <text x="10" y="25" fill="#323330" font-family="monospace" font-size="12">const arrow = () => {}</text>
    
    <!-- Async/Await -->
    <rect x="0" y="50" width="200" height="40" fill="#FFFFFF" opacity="0.9" rx="4"/>
    <text x="10" y="75" fill="#323330" font-family="monospace" font-size="12">async function getData() {}</text>
    
    <!-- Destructuring -->
    <rect x="0" y="100" width="200" height="40" fill="#FFFFFF" opacity="0.9" rx="4"/>
    <text x="10" y="125" fill="#323330" font-family="monospace" font-size="12">const {name, age} = user;</text>
    
    <!-- Spread operator -->
    <rect x="0" y="150" width="200" height="40" fill="#FFFFFF" opacity="0.9" rx="4"/>
    <text x="10" y="175" fill="#323330" font-family="monospace" font-size="12">const newArray = [...array];</text>
  </g>
  
  <!-- Console output -->
  <g transform="translate(100, 320)">
    <rect x="0" y="0" width="250" height="60" fill="#000000" opacity="0.8" rx="4"/>
    <text x="10" y="20" fill="#00FF00" font-family="monospace" font-size="11">> greet("World")</text>
    <text x="10" y="40" fill="#FFFFFF" font-family="monospace" font-size="11">"Hello, World!"</text>
  </g>
  
  <!-- Floating JS symbols -->
  <text x="700" y="100" fill="#FFFFFF" font-family="monospace" font-size="14" opacity="0.6">{}</text>
  <text x="720" y="130" fill="#FFFFFF" font-family="monospace" font-size="14" opacity="0.6">[]</text>
  <text x="690" y="160" fill="#FFFFFF" font-family="monospace" font-size="14" opacity="0.6">=&gt;</text>
  <text x="710" y="190" fill="#FFFFFF" font-family="monospace" font-size="14" opacity="0.6">=&lt;</text>
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" fill="#323330" font-family="Arial, sans-serif" font-size="36" font-weight="bold">JavaScript Complete Guide</text>
  
  <!-- Subtitle -->
  <text x="400" y="420" text-anchor="middle" fill="#323330" font-family="Arial, sans-serif" font-size="18" opacity="0.9">From Basics to Advanced ES6+</text>
</svg>
