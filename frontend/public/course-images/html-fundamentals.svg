<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E34C26;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F06529;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- HTML5 Logo -->
  <g transform="translate(350, 150)">
    <!-- Shield background -->
    <path d="M 0 0 L 0 80 L 10 100 L 90 100 L 100 80 L 100 0 Z" fill="#FFFFFF" opacity="0.9"/>
    
    <!-- HTML text -->
    <text x="50" y="35" text-anchor="middle" fill="#E34C26" font-family="Arial, sans-serif" font-size="24" font-weight="bold">HTML</text>
    <text x="50" y="60" text-anchor="middle" fill="#E34C26" font-family="Arial, sans-serif" font-size="14">5</text>
  </g>
  
  <!-- HTML tags floating around -->
  <text x="150" y="100" fill="#FFFFFF" font-family="monospace" font-size="16" opacity="0.7">&lt;html&gt;</text>
  <text x="600" y="120" fill="#FFFFFF" font-family="monospace" font-size="16" opacity="0.7">&lt;head&gt;</text>
  <text x="180" y="350" fill="#FFFFFF" font-family="monospace" font-size="16" opacity="0.7">&lt;body&gt;</text>
  <text x="580" y="340" fill="#FFFFFF" font-family="monospace" font-size="16" opacity="0.7">&lt;div&gt;</text>
  
  <!-- Semantic elements -->
  <rect x="100" y="180" width="80" height="40" fill="#FFFFFF" opacity="0.8" rx="4"/>
  <text x="140" y="205" text-anchor="middle" fill="#E34C26" font-family="Arial, sans-serif" font-size="12">&lt;header&gt;</text>
  
  <rect x="220" y="180" width="80" height="40" fill="#FFFFFF" opacity="0.8" rx="4"/>
  <text x="260" y="205" text-anchor="middle" fill="#E34C26" font-family="Arial, sans-serif" font-size="12">&lt;nav&gt;</text>
  
  <rect x="340" y="180" width="80" height="40" fill="#FFFFFF" opacity="0.8" rx="4"/>
  <text x="380" y="205" text-anchor="middle" fill="#E34C26" font-family="Arial, sans-serif" font-size="12">&lt;main&gt;</text>
  
  <rect x="460" y="180" width="80" height="40" fill="#FFFFFF" opacity="0.8" rx="4"/>
  <text x="500" y="205" text-anchor="middle" fill="#E34C26" font-family="Arial, sans-serif" font-size="12">&lt;footer&gt;</text>
  
  <!-- Form elements -->
  <rect x="150" y="280" width="120" height="60" fill="#FFFFFF" opacity="0.7" rx="4"/>
  <rect x="160" y="295" width="100" height="8" fill="#E34C26" opacity="0.6" rx="2"/>
  <rect x="160" y="310" width="100" height="20" fill="#F5F5F5" opacity="0.8" rx="2"/>
  <text x="210" y="325" text-anchor="middle" fill="#666666" font-family="Arial, sans-serif" font-size="10">Input Field</text>
  
  <!-- Button -->
  <rect x="500" y="290" width="80" height="30" fill="#E34C26" opacity="0.8" rx="4"/>
  <text x="540" y="310" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="12">Submit</text>
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="36" font-weight="bold">HTML Fundamentals</text>
  
  <!-- Subtitle -->
  <text x="400" y="400" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" opacity="0.9">Master Semantic HTML5 Markup</text>
</svg>
