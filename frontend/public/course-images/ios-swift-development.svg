<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1D1D1F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- iOS Device -->
  <g transform="translate(350, 120)">
    <!-- iPhone frame -->
    <rect x="30" y="20" width="40" height="70" fill="#1D1D1F" rx="8"/>
    <rect x="32" y="25" width="36" height="60" fill="#000000" rx="6"/>
    
    <!-- Screen content -->
    <rect x="35" y="30" width="30" height="40" fill="#007AFF" rx="2"/>
    <text x="50" y="50" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="8">Swift</text>
    
    <!-- Home button -->
    <circle cx="50" cy="85" r="3" fill="#666666"/>
    
    <!-- Notch -->
    <rect x="45" y="25" width="10" height="3" fill="#1D1D1F" rx="1"/>
    
    <text x="50" y="105" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="14">iOS Development</text>
    <text x="50" y="120" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">Swift & SwiftUI</text>
  </g>
  
  <!-- Swift Code -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="200" height="120" fill="#FFFFFF" opacity="0.9" rx="6"/>
    <text x="100" y="20" text-anchor="middle" fill="#007AFF" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Swift Code</text>
    
    <!-- Swift syntax -->
    <text x="10" y="40" fill="#C678DD" font-family="monospace" font-size="10">import</text>
    <text x="40" y="40" fill="#61DAFB" font-family="monospace" font-size="10">SwiftUI</text>
    
    <text x="10" y="52" fill="#C678DD" font-family="monospace" font-size="10">struct</text>
    <text x="40" y="52" fill="#61DAFB" font-family="monospace" font-size="10">ContentView</text>
    <text x="95" y="52" fill="#E06C75" font-family="monospace" font-size="10">:</text>
    <text x="100" y="52" fill="#61DAFB" font-family="monospace" font-size="10">View</text>
    <text x="125" y="52" fill="#E06C75" font-family="monospace" font-size="10">{</text>
    
    <text x="20" y="64" fill="#61DAFB" font-family="monospace" font-size="10">@State</text>
    <text x="50" y="64" fill="#C678DD" font-family="monospace" font-size="10">var</text>
    <text x="70" y="64" fill="#61DAFB" font-family="monospace" font-size="10">count</text>
    <text x="95" y="64" fill="#D19A66" font-family="monospace" font-size="10">=</text>
    <text x="105" y="64" fill="#D19A66" font-family="monospace" font-size="10">0</text>
    
    <text x="20" y="76" fill="#C678DD" font-family="monospace" font-size="10">var</text>
    <text x="40" y="76" fill="#61DAFB" font-family="monospace" font-size="10">body</text>
    <text x="65" y="76" fill="#E06C75" font-family="monospace" font-size="10">:</text>
    <text x="70" y="76" fill="#C678DD" font-family="monospace" font-size="10">some</text>
    <text x="95" y="76" fill="#61DAFB" font-family="monospace" font-size="10">View</text>
    <text x="115" y="76" fill="#E06C75" font-family="monospace" font-size="10">{</text>
    
    <text x="30" y="88" fill="#61DAFB" font-family="monospace" font-size="10">VStack</text>
    <text x="60" y="88" fill="#E06C75" font-family="monospace" font-size="10">{</text>
    
    <text x="40" y="100" fill="#61DAFB" font-family="monospace" font-size="10">Text</text>
    <text x="65" y="100" fill="#E06C75" font-family="monospace" font-size="10">(</text>
    <text x="70" y="100" fill="#98C379" font-family="monospace" font-size="10">"Count: \(count)"</text>
    <text x="130" y="100" fill="#E06C75" font-family="monospace" font-size="10">)</text>
    
    <text x="10" y="112" fill="#E06C75" font-family="monospace" font-size="10">}</text>
  </g>
  
  <!-- iOS Frameworks -->
  <g transform="translate(320, 100)">
    <rect x="0" y="0" width="200" height="120" fill="#FFFFFF" opacity="0.9" rx="6"/>
    <text x="100" y="20" text-anchor="middle" fill="#007AFF" font-family="Arial, sans-serif" font-size="14" font-weight="bold">iOS Frameworks</text>
    
    <!-- Framework boxes -->
    <rect x="10" y="35" width="85" height="25" fill="#007AFF" rx="3"/>
    <text x="52" y="52" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">SwiftUI</text>
    
    <rect x="105" y="35" width="85" height="25" fill="#5856D6" rx="3"/>
    <text x="147" y="52" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">UIKit</text>
    
    <rect x="10" y="65" width="85" height="25" fill="#007AFF" rx="3"/>
    <text x="52" y="82" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">Core Data</text>
    
    <rect x="105" y="65" width="85" height="25" fill="#5856D6" rx="3"/>
    <text x="147" y="82" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">Combine</text>
    
    <rect x="55" y="95" width="90" height="20" fill="#007AFF" rx="3"/>
    <text x="100" y="108" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">Core Animation</text>
  </g>
  
  <!-- App Store -->
  <g transform="translate(540, 100)">
    <rect x="0" y="0" width="200" height="120" fill="#FFFFFF" opacity="0.9" rx="6"/>
    <text x="100" y="20" text-anchor="middle" fill="#007AFF" font-family="Arial, sans-serif" font-size="14" font-weight="bold">App Store</text>
    
    <!-- App Store icon -->
    <rect x="75" y="35" width="50" height="50" fill="#007AFF" rx="12"/>
    <text x="100" y="55" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="8">App</text>
    <text x="100" y="65" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="8">Store</text>
    
    <!-- Features -->
    <text x="10" y="100" fill="#666666" font-family="Arial, sans-serif" font-size="9">✓ App Review Process</text>
    <text x="10" y="112" fill="#666666" font-family="Arial, sans-serif" font-size="9">✓ App Store Connect</text>
    
    <text x="110" y="100" fill="#666666" font-family="Arial, sans-serif" font-size="9">✓ TestFlight</text>
    <text x="110" y="112" fill="#666666" font-family="Arial, sans-serif" font-size="9">✓ Analytics</text>
  </g>
  
  <!-- iOS Features -->
  <g transform="translate(100, 280)">
    <rect x="0" y="0" width="200" height="120" fill="#FFFFFF" opacity="0.9" rx="6"/>
    <text x="100" y="20" text-anchor="middle" fill="#007AFF" font-family="Arial, sans-serif" font-size="14" font-weight="bold">iOS Features</text>
    
    <!-- Feature boxes -->
    <rect x="10" y="35" width="85" height="25" fill="#007AFF" rx="3"/>
    <text x="52" y="52" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">SiriKit</text>
    
    <rect x="105" y="35" width="85" height="25" fill="#5856D6" rx="3"/>
    <text x="147" y="52" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">ARKit</text>
    
    <rect x="10" y="65" width="85" height="25" fill="#007AFF" rx="3"/>
    <text x="52" y="82" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">HealthKit</text>
    
    <rect x="105" y="65" width="85" height="25" fill="#5856D6" rx="3"/>
    <text x="147" y="82" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">HomeKit</text>
    
    <text x="100" y="115" text-anchor="middle" fill="#666666" font-family="monospace" font-size="9">Native Integration</text>
  </g>
  
  <!-- Design Patterns -->
  <g transform="translate(320, 280)">
    <rect x="0" y="0" width="200" height="120" fill="#FFFFFF" opacity="0.9" rx="6"/>
    <text x="100" y="20" text-anchor="middle" fill="#007AFF" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Design Patterns</text>
    
    <!-- Pattern boxes -->
    <rect x="10" y="35" width="85" height="25" fill="#007AFF" rx="3"/>
    <text x="52" y="52" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">MVC</text>
    
    <rect x="105" y="35" width="85" height="25" fill="#5856D6" rx="3"/>
    <text x="147" y="52" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">MVVM</text>
    
    <rect x="10" y="65" width="85" height="25" fill="#007AFF" rx="3"/>
    <text x="52" y="82" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">Delegate</text>
    
    <rect x="105" y="65" width="85" height="25" fill="#5856D6" rx="3"/>
    <text x="147" y="82" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">Observer</text>
    
    <text x="100" y="115" text-anchor="middle" fill="#666666" font-family="monospace" font-size="9">iOS Architecture</text>
  </g>
  
  <!-- Testing -->
  <g transform="translate(540, 280)">
    <rect x="0" y="0" width="200" height="120" fill="#FFFFFF" opacity="0.9" rx="6"/>
    <text x="100" y="20" text-anchor="middle" fill="#007AFF" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Testing</text>
    
    <!-- Test types -->
    <rect x="10" y="35" width="85" height="25" fill="#007AFF" rx="3"/>
    <text x="52" y="52" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">Unit Tests</text>
    
    <rect x="105" y="35" width="85" height="25" fill="#5856D6" rx="3"/>
    <text x="147" y="52" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">UI Tests</text>
    
    <rect x="10" y="65" width="85" height="25" fill="#007AFF" rx="3"/>
    <text x="52" y="82" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">XCTest</text>
    
    <rect x="105" y="65" width="85" height="25" fill="#5856D6" rx="3"/>
    <text x="147" y="82" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">Quick/Nimble</text>
    
    <text x="100" y="115" text-anchor="middle" fill="#666666" font-family="monospace" font-size="9">Quality Assurance</text>
  </g>
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="36" font-weight="bold">iOS Swift Development</text>
  
  <!-- Subtitle -->
  <text x="400" y="420" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" opacity="0.9">Native iOS App Development</text>
</svg>
