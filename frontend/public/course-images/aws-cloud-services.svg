<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9900;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#EC7211;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF9900;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- AWS Logo -->
  <g transform="translate(350, 120)">
    <text x="50" y="40" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="32" font-weight="bold">AWS</text>
    <text x="50" y="65" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="14">Cloud Services</text>
  </g>
  
  <!-- Core AWS Services -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="200" height="120" fill="#FFFFFF" opacity="0.9" rx="6"/>
    <text x="100" y="20" text-anchor="middle" fill="#FF9900" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Core Services</text>
    
    <!-- Service boxes -->
    <rect x="10" y="35" width="85" height="25" fill="#FF9900" rx="3"/>
    <text x="52" y="52" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">EC2</text>
    
    <rect x="105" y="35" width="85" height="25" fill="#EC7211" rx="3"/>
    <text x="147" y="52" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">S3</text>
    
    <rect x="10" y="65" width="85" height="25" fill="#FF9900" rx="3"/>
    <text x="52" y="82" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">RDS</text>
    
    <rect x="105" y="65" width="85" height="25" fill="#EC7211" rx="3"/>
    <text x="147" y="82" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">Lambda</text>
    
    <text x="100" y="115" text-anchor="middle" fill="#666666" font-family="monospace" font-size="9">Compute & Storage</text>
  </g>
  
  <!-- Networking -->
  <g transform="translate(320, 100)">
    <rect x="0" y="0" width="200" height="120" fill="#FFFFFF" opacity="0.9" rx="6"/>
    <text x="100" y="20" text-anchor="middle" fill="#FF9900" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Networking</text>
    
    <!-- Network components -->
    <rect x="10" y="35" width="180" height="70" fill="#F5F5F5" rx="4"/>
    
    <!-- VPC -->
    <rect x="15" y="40" width="170" height="60" fill="#FF9900" opacity="0.2" rx="3"/>
    <text x="100" y="50" text-anchor="middle" fill="#FF9900" font-family="Arial, sans-serif" font-size="10">VPC</text>
    
    <!-- Subnets -->
    <rect x="20" y="55" width="75" height="20" fill="#EC7211" opacity="0.3" rx="2"/>
    <text x="57" y="68" text-anchor="middle" fill="#EC7211" font-family="Arial, sans-serif" font-size="8">Public Subnet</text>
    
    <rect x="105" y="55" width="75" height="20" fill="#FF9900" opacity="0.3" rx="2"/>
    <text x="142" y="68" text-anchor="middle" fill="#FF9900" font-family="Arial, sans-serif" font-size="8">Private Subnet</text>
    
    <!-- Services -->
    <rect x="25" y="80" width="30" height="15" fill="#EC7211" rx="2"/>
    <text x="40" y="90" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="6">ELB</text>
    
    <rect x="60" y="80" width="30" height="15" fill="#FF9900" rx="2"/>
    <text x="75" y="90" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="6">EC2</text>
    
    <rect x="110" y="80" width="30" height="15" fill="#EC7211" rx="2"/>
    <text x="125" y="90" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="6">RDS</text>
    
    <rect x="145" y="80" width="30" height="15" fill="#FF9900" rx="2"/>
    <text x="160" y="90" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="6">EFS</text>
  </g>
  
  <!-- AWS CLI Commands -->
  <g transform="translate(540, 100)">
    <rect x="0" y="0" width="200" height="120" fill="#FFFFFF" opacity="0.9" rx="6"/>
    <text x="100" y="20" text-anchor="middle" fill="#FF9900" font-family="Arial, sans-serif" font-size="14" font-weight="bold">AWS CLI</text>
    
    <!-- Command examples -->
    <text x="10" y="40" fill="#666666" font-family="monospace" font-size="9">aws ec2 run-instances</text>
    <text x="10" y="52" fill="#666666" font-family="monospace" font-size="9">aws s3 ls s3://my-bucket</text>
    <text x="10" y="64" fill="#666666" font-family="monospace" font-size="9">aws rds create-db-instance</text>
    <text x="10" y="76" fill="#666666" font-family="monospace" font-size="9">aws lambda create-function</text>
    <text x="10" y="88" fill="#666666" font-family="monospace" font-size="9">aws cloudformation deploy</text>
    <text x="10" y="100" fill="#666666" font-family="monospace" font-size="9">aws eks create-cluster</text>
    <text x="10" y="112" fill="#666666" font-family="monospace" font-size="9">aws configure set region us-east-1</text>
  </g>
  
  <!-- IAM & Security -->
  <g transform="translate(100, 280)">
    <rect x="0" y="0" width="200" height="120" fill="#FFFFFF" opacity="0.9" rx="6"/>
    <text x="100" y="20" text-anchor="middle" fill="#FF9900" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Security</text>
    
    <!-- Security components -->
    <rect x="10" y="35" width="85" height="25" fill="#FF9900" rx="3"/>
    <text x="52" y="52" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">IAM</text>
    
    <rect x="105" y="35" width="85" height="25" fill="#EC7211" rx="3"/>
    <text x="147" y="52" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">Security Groups</text>
    
    <rect x="10" y="65" width="85" height="25" fill="#FF9900" rx="3"/>
    <text x="52" y="82" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">KMS</text>
    
    <rect x="105" y="65" width="85" height="25" fill="#EC7211" rx="3"/>
    <text x="147" y="82" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">CloudTrail</text>
    
    <text x="100" y="115" text-anchor="middle" fill="#666666" font-family="monospace" font-size="9">Identity & Access Mgmt</text>
  </g>
  
  <!-- Serverless -->
  <g transform="translate(320, 280)">
    <rect x="0" y="0" width="200" height="120" fill="#FFFFFF" opacity="0.9" rx="6"/>
    <text x="100" y="20" text-anchor="middle" fill="#FF9900" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Serverless</text>
    
    <!-- Serverless architecture -->
    <rect x="10" y="35" width="180" height="70" fill="#F5F5F5" rx="4"/>
    
    <!-- API Gateway -->
    <rect x="15" y="40" width="170" height="15" fill="#FF9900" rx="2"/>
    <text x="100" y="50" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="8">API Gateway</text>
    
    <!-- Lambda functions -->
    <rect x="20" y="60" width="40" height="20" fill="#EC7211" rx="2"/>
    <text x="40" y="73" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="7">Lambda</text>
    
    <rect x="70" y="60" width="40" height="20" fill="#FF9900" rx="2"/>
    <text x="90" y="73" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="7">Lambda</text>
    
    <rect x="120" y="60" width="40" height="20" fill="#EC7211" rx="2"/>
    <text x="140" y="73" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="7">Lambda</text>
    
    <!-- Services -->
    <rect x="25" y="85" width="30" height="15" fill="#FF9900" rx="2"/>
    <text x="40" y="95" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="6">DynamoDB</text>
    
    <rect x="65" y="85" width="30" height="15" fill="#EC7211" rx="2"/>
    <text x="80" y="95" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="6">S3</text>
    
    <rect x="105" y="85" width="30" height="15" fill="#FF9900" rx="2"/>
    <text x="120" y="95" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="6">SQS</text>
    
    <rect x="145" y="85" width="30" height="15" fill="#EC7211" rx="2"/>
    <text x="160" y="95" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="6">SNS</text>
  </g>
  
  <!-- Cost Optimization -->
  <g transform="translate(540, 280)">
    <rect x="0" y="0" width="200" height="120" fill="#FFFFFF" opacity="0.9" rx="6"/>
    <text x="100" y="20" text-anchor="middle" fill="#FF9900" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Cost Mgmt</text>
    
    <!-- Cost strategies -->
    <rect x="10" y="35" width="85" height="25" fill="#FF9900" rx="3"/>
    <text x="52" y="52" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">Reserved</text>
    
    <rect x="105" y="35" width="85" height="25" fill="#EC7211" rx="3"/>
    <text x="147" y="52" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">Spot</text>
    
    <rect x="10" y="65" width="85" height="25" fill="#FF9900" rx="3"/>
    <text x="52" y="82" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">Auto Scaling</text>
    
    <rect x="105" y="65" width="85" height="25" fill="#EC7211" rx="3"/>
    <text x="147" y="82" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">Budgets</text>
    
    <text x="100" y="115" text-anchor="middle" fill="#666666" font-family="monospace" font-size="9">Cost Explorer</text>
  </g>
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="36" font-weight="bold">AWS Cloud Services</text>
  
  <!-- Subtitle -->
  <text x="400" y="420" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" opacity="0.9">Cloud Architecture & Services</text>
</svg>
