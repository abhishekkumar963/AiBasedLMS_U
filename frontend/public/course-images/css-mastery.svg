<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1572B6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#33A9DC;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient-box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4ECDC4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- CSS3 Logo -->
  <g transform="translate(350, 150)">
    <!-- CSS3 text -->
    <text x="50" y="40" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="32" font-weight="bold">CSS3</text>
  </g>
  
  <!-- Style showcase boxes -->
  <rect x="100" y="120" width="100" height="80" fill="url(#gradient-box)" rx="8" opacity="0.9"/>
  <text x="150" y="165" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Gradient</text>
  
  <rect x="250" y="120" width="100" height="80" fill="#FF6B6B" rx="50%" opacity="0.9"/>
  <text x="300" y="165" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Border</text>
  
  <rect x="400" y="120" width="100" height="80" fill="#4ECDC4" rx="8" opacity="0.9" transform="rotate(5 450 160)"/>
  <text x="450" y="165" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Transform</text>
  
  <rect x="550" y="120" width="100" height="80" fill="#FFE66D" rx="8" opacity="0.9"/>
  <text x="600" y="165" text-anchor="middle" fill="#333333" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Shadow</text>
  
  <!-- CSS properties display -->
  <g transform="translate(120, 250)">
    <rect x="0" y="0" width="200" height="120" fill="#FFFFFF" opacity="0.9" rx="6"/>
    <text x="10" y="20" fill="#1572B6" font-family="monospace" font-size="12" font-weight="bold">.element {</text>
    <text x="20" y="40" fill="#666666" font-family="monospace" font-size="11">  color: #333;</text>
    <text x="20" y="55" fill="#666666" font-family="monospace" font-size="11">  background: linear-gradient(...);</text>
    <text x="20" y="70" fill="#666666" font-family="monospace" font-size="11">  border-radius: 8px;</text>
    <text x="20" y="85" fill="#666666" font-family="monospace" font-size="11">  transform: rotate(5deg);</text>
    <text x="20" y="100" fill="#666666" font-family="monospace" font-size="11">  box-shadow: 0 4px 6px rgba(0,0,0,0.1);</text>
    <text x="10" y="115" fill="#1572B6" font-family="monospace" font-size="12" font-weight="bold">}</text>
  </g>
  
  <!-- Flexbox demonstration -->
  <g transform="translate(480, 250)">
    <rect x="0" y="0" width="200" height="120" fill="#FFFFFF" opacity="0.9" rx="6"/>
    <rect x="10" y="10" width="180" height="100" fill="#F5F5F5" rx="4"/>
    
    <!-- Flex items -->
    <rect x="20" y="30" width="35" height="60" fill="#FF6B6B" rx="2"/>
    <rect x="65" y="30" width="35" height="60" fill="#4ECDC4" rx="2"/>
    <rect x="110" y="30" width="35" height="60" fill="#FFE66D" rx="2"/>
    <rect x="155" y="30" width="25" height="60" fill="#1572B6" rx="2"/>
    
    <text x="100" y="15" text-anchor="middle" fill="#1572B6" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Flexbox Layout</text>
  </g>
  
  <!-- Floating CSS symbols -->
  <text x="50" y="80" fill="#FFFFFF" font-family="monospace" font-size="14" opacity="0.6">#selector</text>
  <text x="700" y="90" fill="#FFFFFF" font-family="monospace" font-size="14" opacity="0.6">.class</text>
  <text x="80" y="400" fill="#FFFFFF" font-family="monospace" font-size="14" opacity="0.6">@media</text>
  <text x="680" y="380" fill="#FFFFFF" font-family="monospace" font-size="14" opacity="0.6">:hover</text>
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="36" font-weight="bold">CSS Styling Mastery</text>
  
  <!-- Subtitle -->
  <text x="400" y="420" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" opacity="0.9">Create Beautiful Responsive Designs</text>
</svg>
