<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F7931E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B35;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- NLP Title -->
  <g transform="translate(350, 120)">
    <text x="50" y="40" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="28" font-weight="bold">NLP</text>
    <text x="50" y="65" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="14">Natural Language Processing</text>
  </g>
  
  <!-- Text Processing Pipeline -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="200" height="120" fill="#FFFFFF" opacity="0.9" rx="6"/>
    <text x="100" y="20" text-anchor="middle" fill="#FF6B35" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Text Pipeline</text>
    
    <!-- Pipeline steps -->
    <rect x="10" y="35" width="35" height="25" fill="#FF6B35" rx="3"/>
    <text x="27" y="45" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="8">Raw</text>
    <text x="27" y="56" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="6">Text</text>
    
    <path d="M 45 47 L 65 47" stroke="#FF6B35" stroke-width="2" marker-end="url(#arrow-orange)"/>
    
    <rect x="65" y="35" width="35" height="25" fill="#F7931E" rx="3"/>
    <text x="82" y="45" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="8">Token</text>
    <text x="82" y="56" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="6">ize</text>
    
    <path d="M 100 47 L 120 47" stroke="#FF6B35" stroke-width="2" marker-end="url(#arrow-orange)"/>
    
    <rect x="120" y="35" width="35" height="25" fill="#FF6B35" rx="3"/>
    <text x="137" y="45" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="8">Vector</text>
    <text x="137" y="56" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="6">ize</text>
    
    <path d="M 155 47 L 175 47" stroke="#FF6B35" stroke-width="2" marker-end="url(#arrow-orange)"/>
    
    <rect x="175" y="35" width="20" height="25" fill="#F7931E" rx="3"/>
    <text x="185" y="45" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="8">ML</text>
    <text x="185" y="56" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="6">Model</text>
    
    <!-- Processing steps -->
    <text x="10" y="75" fill="#666666" font-family="monospace" font-size="8">• Lowercasing</text>
    <text x="10" y="87" fill="#666666" font-family="monospace" font-size="8">• Stop word removal</text>
    <text x="10" y="99" fill="#666666" font-family="monospace" font-size="8">• Stemming/Lemmatization</text>
    <text x="10" y="111" fill="#666666" font-family="monospace" font-size="8">• TF-IDF, Word2Vec, BERT</text>
  </g>
  
  <!-- Transformer Architecture -->
  <g transform="translate(320, 100)">
    <rect x="0" y="0" width="200" height="120" fill="#FFFFFF" opacity="0.9" rx="6"/>
    <text x="100" y="20" text-anchor="middle" fill="#FF6B35" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Transformer Model</text>
    
    <!-- Transformer components -->
    <rect x="10" y="35" width="80" height="20" fill="#FF6B35" rx="3"/>
    <text x="50" y="48" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">Input Embedding</text>
    
    <rect x="100" y="35" width="80" height="20" fill="#F7931E" rx="3"/>
    <text x="140" y="48" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">Positional Encoding</text>
    
    <rect x="10" y="60" width="40" height="20" fill="#FF6B35" rx="3"/>
    <text x="30" y="73" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="8">Multi-Head</text>
    
    <rect x="55" y="60" width="40" height="20" fill="#F7931E" rx="3"/>
    <text x="75" y="73" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="8">Attention</text>
    
    <rect x="100" y="60" width="80" height="20" fill="#FF6B35" rx="3"/>
    <text x="140" y="73" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">Feed Forward</text>
    
    <rect x="10" y="85" width="80" height="20" fill="#F7931E" rx="3"/>
    <text x="50" y="98" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">Layer Normalization</text>
    
    <rect x="100" y="85" width="80" height="20" fill="#FF6B35" rx="3"/>
    <text x="140" y="98" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">Output Projection</text>
  </g>
  
  <!-- NLP Tasks -->
  <g transform="translate(540, 100)">
    <rect x="0" y="0" width="200" height="120" fill="#FFFFFF" opacity="0.9" rx="6"/>
    <text x="100" y="20" text-anchor="middle" fill="#FF6B35" font-family="Arial, sans-serif" font-size="14" font-weight="bold">NLP Tasks</text>
    
    <!-- Task boxes -->
    <rect x="10" y="35" width="85" height="20" fill="#FF6B35" rx="3"/>
    <text x="52" y="48" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">Classification</text>
    
    <rect x="105" y="35" width="85" height="20" fill="#F7931E" rx="3"/>
    <text x="147" y="48" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">Translation</text>
    
    <rect x="10" y="60" width="85" height="20" fill="#FF6B35" rx="3"/>
    <text x="52" y="73" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">Summarization</text>
    
    <rect x="105" y="60" width="85" height="20" fill="#F7931E" rx="3"/>
    <text x="147" y="73" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">Question Answer</text>
    
    <rect x="10" y="85" width="85" height="20" fill="#FF6B35" rx="3"/>
    <text x="52" y="98" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">Sentiment</text>
    
    <rect x="105" y="85" width="85" height="20" fill="#F7931E" rx="3"/>
    <text x="147" y="98" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">NER</text>
  </g>
  
  <!-- Popular Models -->
  <g transform="translate(100, 280)">
    <rect x="0" y="0" width="250" height="120" fill="#FFFFFF" opacity="0.9" rx="6"/>
    <text x="125" y="20" text-anchor="middle" fill="#FF6B35" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Popular Models</text>
    
    <!-- Model boxes -->
    <rect x="10" y="35" width="70" height="25" fill="#FF6B35" rx="3"/>
    <text x="45" y="52" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">BERT</text>
    
    <rect x="90" y="35" width="70" height="25" fill="#F7931E" rx="3"/>
    <text x="125" y="52" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">GPT</text>
    
    <rect x="170" y="35" width="70" height="25" fill="#FF6B35" rx="3"/>
    <text x="205" y="52" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">T5</text>
    
    <rect x="10" y="65" width="70" height="25" fill="#F7931E" rx="3"/>
    <text x="45" y="82" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">RoBERTa</text>
    
    <rect x="90" y="65" width="70" height="25" fill="#FF6B35" rx="3"/>
    <text x="125" y="82" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">XLNet</text>
    
    <rect x="170" y="65" width="70" height="25" fill="#F7931E" rx="3"/>
    <text x="205" y="82" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">ALBERT</text>
    
    <text x="125" y="105" text-anchor="middle" fill="#666666" font-family="monospace" font-size="9">Hugging Face Transformers</text>
  </g>
  
  <!-- Applications -->
  <g transform="translate(380, 280)">
    <rect x="0" y="0" width="250" height="120" fill="#FFFFFF" opacity="0.9" rx="6"/>
    <text x="125" y="20" text-anchor="middle" fill="#FF6B35" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Real Applications</text>
    
    <!-- Application areas -->
    <rect x="10" y="35" width="110" height="25" fill="#FF6B35" rx="3"/>
    <text x="65" y="52" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">Chatbots</text>
    
    <rect x="130" y="35" width="110" height="25" fill="#F7931E" rx="3"/>
    <text x="185" y="52" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">Search Engines</text>
    
    <rect x="10" y="65" width="110" height="25" fill="#FF6B35" rx="3"/>
    <text x="65" y="82" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">Voice Assistants</text>
    
    <rect x="130" y="65" width="110" height="25" fill="#F7931E" rx="3"/>
    <text x="185" y="82" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">Translation</text>
    
    <rect x="70" y="95" width="110" height="20" fill="#FF6B35" rx="3"/>
    <text x="125" y="108" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">Content Analysis</text>
  </g>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FF6B35"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="36" font-weight="bold">Natural Language Processing</text>
  
  <!-- Subtitle -->
  <text x="400" y="420" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" opacity="0.9">Language Understanding & Generation</text>
</svg>
