<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0891B2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0E7490;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="phone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1F2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#DBEAFE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#BFDBFE;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- Phone mockup -->
  <g transform="translate(150, 100)">
    <rect x="0" y="0" width="120" height="240" fill="url(#phone)" rx="15"/>
    <rect x="10" y="30" width="100" height="180" fill="url(#screen)" rx="8"/>
    
    <!-- Phone speaker -->
    <rect x="45" y="10" width="30" height="4" fill="#374151" rx="2"/>
    
    <!-- Phone button -->
    <circle cx="60" cy="220" r="8" fill="none" stroke="#6B7280" stroke-width="2"/>
    
    <!-- App icons on screen -->
    <rect x="20" y="40" width="20" height="20" fill="#EF4444" rx="4"/>
    <rect x="50" y="40" width="20" height="20" fill="#3B82F6" rx="4"/>
    <rect x="80" y="40" width="20" height="20" fill="#10B981" rx="4"/>
    
    <rect x="20" y="70" width="20" height="20" fill="#F59E0B" rx="4"/>
    <rect x="50" y="70" width="20" height="20" fill="#8B5CF6" rx="4"/>
    <rect x="80" y="70" width="20" height="20" fill="#EC4899" rx="4"/>
    
    <!-- App interface elements -->
    <rect x="15" y="110" width="90" height="8" fill="#E5E7EB" rx="4"/>
    <rect x="15" y="125" width="70" height="6" fill="#D1D5DB" rx="3"/>
    <rect x="15" y="140" width="80" height="6" fill="#D1D5DB" rx="3"/>
    
    <rect x="15" y="155" width="40" height="40" fill="#3B82F6" rx="8"/>
    <rect x="65" y="155" width="40" height="40" fill="#10B981" rx="8"/>
  </g>
  
  <!-- Tablet mockup -->
  <g transform="translate(350, 80)">
    <rect x="0" y="0" width="180" height="260" fill="url(#phone)" rx="12"/>
    <rect x="10" y="20" width="160" height="220" fill="url(#screen)" rx="6"/>
    
    <!-- Tablet camera -->
    <circle cx="90" cy="10" r="4" fill="#374151"/>
    
    <!-- App layout -->
    <rect x="20" y="30" width="140" height="30" fill="#3B82F6" rx="6"/>
    <rect x="20" y="70" width="65" height="60" fill="#10B981" rx="6"/>
    <rect x="95" y="70" width="65" height="60" fill="#F59E0B" rx="6"/>
    <rect x="20" y="140" width="65" height="60" fill="#8B5CF6" rx="6"/>
    <rect x="95" y="140" width="65" height="60" fill="#EC4899" rx="6"/>
  </g>
  
  <!-- React Native logo -->
  <g transform="translate(600, 180)">
    <ellipse cx="0" cy="0" rx="50" ry="18" fill="none" stroke="#61DAFB" stroke-width="3" opacity="0.8"/>
    <ellipse cx="0" cy="0" rx="50" ry="18" fill="none" stroke="#61DAFB" stroke-width="3" opacity="0.8" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="50" ry="18" fill="none" stroke="#61DAFB" stroke-width="3" opacity="0.8" transform="rotate(120)"/>
    <circle cx="0" cy="0" r="6" fill="#61DAFB"/>
  </g>
  
  <!-- Flutter logo representation -->
  <g transform="translate(650, 280)">
    <text x="0" y="0" text-anchor="middle" fill="#02569B" font-family="Arial, sans-serif" font-size="24" font-weight="bold">Flutter</text>
  </g>
  
  <!-- Floating app icons -->
  <rect x="100" y="50" width="16" height="16" fill="#EF4444" rx="3" opacity="0.7"/>
  <rect x="130" y="60" width="16" height="16" fill="#3B82F6" rx="3" opacity="0.7"/>
  <rect x="160" y="55" width="16" height="16" fill="#10B981" rx="3" opacity="0.7"/>
  
  <!-- Code symbols -->
  <text x="550" y="100" fill="#FFFFFF" font-family="monospace" font-size="16" opacity="0.6">&lt;Mobile/&gt;</text>
  <text x="580" y="350" fill="#FFFFFF" font-family="monospace" font-size="14" opacity="0.6">app.js</text>
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="36" font-weight="bold">Mobile App Development</text>
  
  <!-- Subtitle -->
  <text x="400" y="410" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" opacity="0.9">Build iOS & Android Apps</text>
</svg>
